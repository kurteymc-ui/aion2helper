name: Tests

# Runs on every push to main and on every pull request: the Windows app must build. (The upstream project's own upload server in
# Backend/ is not used by A2HMeter, whose fights go to aion2helper.com, so its tests are not run here.)
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  client:
    name: Client build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build Client/AionDPS.csproj -c Release --nologo
